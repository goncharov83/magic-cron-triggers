name: Dify Cron Trigger 16

on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * *'

jobs:
  trigger_dify:
    runs-on: ubuntu-latest
    steps:
      - name: Call Dify API
        run: |
          curl -X POST 'https://api.dify.ai/v1/chat-messages' \
            --header 'Authorization: Bearer ${{ secrets.DIFY_API_KEY }}' \
            --header 'Content-Type: application/json' \
            --data-raw '{
                "inputs": {},
                "query": "run_export",
                "response_mode": "blocking",
                "user": "github_action"
            }'
